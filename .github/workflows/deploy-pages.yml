name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static client
        env:
          NEXT_PUBLIC_SITE_URL: https://yiding4869.github.io/llm-interview-lab/
          NEXT_PUBLIC_BASE_PATH: /llm-interview-lab
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Place base-path assets at the Pages artifact root
        run: |
          mv dist/client/llm-interview-lab/_next dist/client/_next
          rmdir dist/client/llm-interview-lab

      - name: Prepare Pages artifact
        run: touch dist/client/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
